<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To-do list</title>
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script>
// Thème appliqué immédiatement pour éviter un flash (préférence enregistrée, sinon thème du système)
document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
</script>
<style>
:root{--bg:#F2F5F3;--sf:#fff;--ink:#16201D;--mu:#66756F;--ln:#DDE5E1;--ac:#1F6F5C}
[data-theme=dark]{--bg:#0F1412;--sf:#19211E;--ink:#E8EEEB;--mu:#8E9F98;--ln:#2A3531;--ac:#4FB79B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
header h1{flex:1;margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.st{font-size:14px;padding:6px 12px;border-radius:99px;background:var(--sf);border:1px solid var(--ln)}
.ib{width:44px;height:44px;border-radius:50%;font-size:20px;flex:none;text-align:center}
main{max-width:640px;margin:0 auto;padding:4px 16px 130px}
h2{font-size:17px;margin:0 0 8px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
section.card{border-left:6px solid var(--c)}
.hello{margin:0 0 12px;color:var(--mu)}
.hero{display:flex;text-align:center;padding:20px 8px}
.hero div{flex:1}
.hero b{display:block;font-size:56px;line-height:1;font-weight:800;color:var(--ac)}
.hero small{display:block;margin-top:6px}
.mu,small{color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row h2{margin:0}
.task,.lg{display:flex;align-items:center;gap:6px;min-height:52px;border-top:1px solid var(--ln)}
.task:first-of-type,.lg:first-of-type{border-top:0}
.lg{gap:10px}
.tk{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px}
.box{width:28px;height:28px;flex:none;border-radius:8px;border:2.5px solid var(--c);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800;line-height:1}
.task.done .box{background:var(--c)}
.task.just .box{animation:tick .35s}
.tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .tx{text-decoration:line-through;color:var(--mu)}
.bar{height:12px;border-radius:7px;background:var(--ln);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .5s}
.day{margin:14px 0 4px;font-weight:600;text-transform:capitalize}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:58px;font-size:13px;color:var(--mu);text-align:center}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:64px;height:64px;border-radius:50%;background:var(--ac);color:#fff;font-size:36px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab:active{transform:scale(.92)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sh h2{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.cp{min-height:46px;padding:0 16px;border-radius:99px;border:2px solid var(--ln)}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--sf)}
.sw.on{border-color:var(--ink)}
input,select{width:100%;min-height:48px;padding:0 12px;margin:0 0 12px;border-radius:12px;border:2px solid var(--ln);background:var(--bg)}
label{display:block;font-size:14px;color:var(--mu)}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;margin:0 0 8px;font-size:16px;color:var(--ink)}
.chk input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--ac)}
.row input{margin:0}
.big{display:block;width:100%;min-height:54px;border-radius:14px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:4px;text-align:center}
.ghost{display:block;width:100%;min-height:48px;margin-top:8px;color:var(--mu);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ac);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;animation:pop .35s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:auto;padding:24px}
.login h1{font-size:44px;margin:0 0 8px;letter-spacing:-.03em;font-weight:800}
.empty{text-align:center;padding:32px 8px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}60%{transform:translateX(-50%) scale(1.08)}}
@keyframes tick{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* ============================================================
   1) CONFIGURATION FIREBASE  → colle ici TON objet firebaseConfig
   (il est public par nature : la sécurité vient des règles Firestore)
   ============================================================ */
const CFG = {
  apiKey: "AIzaSyCAhmpuufM-yZz6CT3Io6NzJ8FWF5G8cbQ",
  authDomain: "todo-list-9c064.firebaseapp.com",
  projectId: "todo-list-9c064",
  storageBucket: "todo-list-9c064.firebasestorage.app",
  messagingSenderId: "621993044137",
  appId: "1:621993044137:web:8799d56cd1f3865d1b61b8"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, updateDoc, deleteDoc, getDocs, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp(CFG);
const auth = getAuth(app);
// Cache hors-ligne : les écritures sont gardées localement puis synchronisées
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ============================================================
   2) ÉTAT ET OUTILS
   Données dans Firestore (même structure qu'avant, rien à migrer) :
   users/{uid}/meta/config  → { domains: [...] }   (= tes catégories)
   users/{uid}/tasks/{id}   → tâches
   users/{uid}/logs/{id}    → une ligne d'historique créée à chaque case cochée
   ============================================================ */
const S = { user: null, uid: null, domains: [], logs: [], tasks: [], view: 'tasks', last: '', just: '' };
let unsubs = [], ov = null;
const COLORS = ['#8B5CF6', '#F97316', '#0EA5E9', '#E11D74', '#16A34A', '#EAB308', '#14B8A6', '#64748B'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dk = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const wk = d => { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }; // lundi
const fr = (d, o) => new Date(d).toLocaleDateString('fr-FR', o);
const dom = id => S.domains.find(d => d.id === id) || { id, name: 'Autre', emoji: '•', color: '#888', goal: 0 };
const col = n => collection(db, 'users', S.uid, n);
const cfgRef = () => doc(db, 'users', S.uid, 'meta', 'config');
const taskRef = id => doc(col('tasks'), id);
const weekStart = () => wk(Date.now()).getTime();
const saveDomains = list => setDoc(cfgRef(), { domains: list }).catch(err);

function toast(t) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.append(e);
  setTimeout(() => e.remove(), 2400);
}
const err = e => toast(e.code === 'permission-denied' ? 'Accès refusé par les règles Firestore.' : 'Erreur : ' + (e.code || e.message));

// Série de jours actifs d'affilée (on compte depuis aujourd'hui, ou hier si rien aujourd'hui)
function streak() {
  const days = new Set(S.logs.map(l => dk(l.ts))); const d = new Date();
  if (!days.has(dk(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (days.has(dk(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ============================================================
   3) TÂCHES : une case = fait / pas fait (on peut décocher)
   t.repeat : 'none' (ponctuelle) | 'daily' (tous les jours) | 'weekly' (toutes les semaines)
   Une tâche récurrente se « décoche » toute seule quand le jour / la semaine change.
   ============================================================ */
const repeatOf = t => t.repeat || (t.perWeek > 0 ? 'weekly' : 'none'); // compatible avec l'ancienne version
function isDone(t) {
  if (!t.done || !t.doneAt) return false;
  const r = repeatOf(t);
  if (r === 'daily') return dk(t.doneAt) === dk(Date.now());
  if (r === 'weekly') return t.doneAt >= weekStart();
  return true;
}
// Une tâche ponctuelle déjà faite disparaît le lendemain (elle reste dans les statistiques)
const visible = t => !isDone(t) || repeatOf(t) !== 'none' || dk(t.doneAt) === dk(Date.now());

function toggle(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (isDone(t)) {                       // décocher : on retire aussi la ligne d'historique
    if (t.logId) deleteDoc(doc(col('logs'), t.logId)).catch(err);
    updateDoc(taskRef(id), { done: false, doneAt: null, logId: null }).catch(err);
    return;
  }
  const r = doc(col('logs'));            // cocher : on enregistre l'activité
  setDoc(r, { domainId: t.domainId, note: t.text, taskId: id, ts: Date.now() }).catch(err);
  updateDoc(taskRef(id), { done: true, doneAt: Date.now(), logId: r.id }).catch(err);
  S.just = id; setTimeout(() => { S.just = ''; }, 700);
  const d = dom(t.domainId), n = S.logs.filter(l => dk(l.ts) === dk(Date.now())).length + 1;
  toast(`Bien joué ! ${d.emoji} ${n} fait${n > 1 ? 'es' : 'e'} aujourd’hui`);
}

/* ============================================================
   4) VUES : « Tâches » et « Statistiques »
   ============================================================ */
const logRow = l => `<div class="lg"><span class="mu">${new Date(l.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span>
  <span class="tx">${esc(dom(l.domainId).emoji)} ${esc(l.note || l.sub || 'Activité')}</span></div>`;

const V = {
  tasks() {
    if (!S.domains.length) return `<div class="empty"><p>Crée ta première catégorie (Sport, Lecture, Travail…) pour y ranger tes tâches.</p><button class="big" data-act="domform" data-id="">＋ Créer une catégorie</button></div>`;
    const n = S.logs.filter(l => dk(l.ts) === dk(Date.now())).length;
    const hello = `<p class="hello">${n ? `✨ ${n} chose${n > 1 ? 's' : ''} faite${n > 1 ? 's' : ''} aujourd’hui` : 'Prêt pour la journée 🌿'}</p>`;
    const cards = S.domains.map(d => {
      const T = S.tasks.filter(t => t.domainId === d.id && visible(t))
        .sort((a, b) => isDone(a) - isDone(b) || a.createdAt - b.createdAt);
      const rows = T.map(t => {
        const ok = isDone(t), r = repeatOf(t);
        const sub = r === 'daily' ? 'Tous les jours' : r === 'weekly' ? 'Chaque semaine' : '';
        return `<div class="task ${ok ? 'done' : ''} ${S.just === t.id ? 'just' : ''}" style="--c:${d.color}">
          <button class="tk" role="checkbox" aria-checked="${ok}" data-act="tick" data-id="${t.id}"><span class="box">${ok ? '✓' : ''}</span>
            <span class="tx">${esc(t.text)}${sub ? `<br><small>🔁 ${sub}</small>` : ''}</span></button>
          <button class="ib" data-act="taskform" data-id="${t.id}" aria-label="Modifier">✎</button></div>`;
      }).join('');
      return `<section class="card" style="--c:${d.color}"><div class="row"><h2>${d.emoji} ${esc(d.name)}</h2><button class="ib" data-act="domform" data-id="${d.id}" aria-label="Modifier la catégorie">✎</button></div>${rows || '<small>Aucune tâche pour l’instant.</small>'}</section>`;
    }).join('');
    return hello + cards + `<button class="cp" data-act="domform" data-id="">＋ Nouvelle catégorie</button>`;
  },
  stats() {
    const t0 = dk(Date.now()), ws = weekStart();
    const L = S.logs.filter(l => dk(l.ts) === t0), W = S.logs.filter(l => l.ts >= ws);
    // Message positif du jour
    const parts = S.domains.map(d => [d, L.filter(l => l.domainId === d.id).length]).filter(p => p[1]).map(([d, k]) => `${k} en ${esc(d.name.toLowerCase())}`);
    const msg = parts.length ? `Aujourd’hui : ${parts.join(', ')}` : 'Une page blanche, prête à accueillir ta journée.';
    // Cette semaine, par catégorie, avec barre d'objectif si défini
    const rows = S.domains.map(d => {
      const k = W.filter(l => l.domainId === d.id).length;
      return `<section class="card" style="--c:${d.color}"><div class="row"><h2>${d.emoji} ${esc(d.name)}</h2><b>${k}${d.goal ? ' / ' + d.goal : ''}</b></div>
        ${d.goal ? `<div class="bar"><i style="width:${Math.min(100, k / d.goal * 100)}%"></i></div>` : ''}
        ${d.goal && k >= d.goal ? '<small>Objectif atteint 🎉</small>' : ''}</section>`;
    }).join('');
    // Graphique : 12 dernières semaines, barres empilées par catégorie
    const s0 = wk(Date.now()), Wk = [];
    for (let i = 11; i >= 0; i--) { const a = new Date(s0); a.setDate(a.getDate() - 7 * i); const b = new Date(a); b.setDate(b.getDate() + 7); Wk.push({ a, L: S.logs.filter(l => l.ts >= a && l.ts < b) }); }
    const mx = Math.max(4, ...Wk.map(w => w.L.length));
    const bars = Wk.map((w, i) => {
      let y = 120;
      const seg = S.domains.map(d => { const k = w.L.filter(l => l.domainId === d.id).length; if (!k) return ''; const h = k / mx * 110; y -= h; return `<rect x="${i * 28 + 4}" y="${y}" width="22" height="${h}" rx="3" fill="${d.color}"/>`; }).join('');
      return seg + `<text x="${i * 28 + 15}" y="135" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">${w.a.getDate()}/${w.a.getMonth() + 1}</text>`;
    }).join('');
    // Historique par jour
    const byDay = {}; S.logs.forEach(l => (byDay[dk(l.ts)] ||= []).push(l));
    const list = Object.keys(byDay).sort().reverse().map(k => `<div class="day">${fr(k + 'T12:00', { weekday: 'long', day: 'numeric', month: 'long' })} <small>· ${byDay[k].length}</small></div><div class="card">${byDay[k].map(logRow).join('')}</div>`).join('');
    return `<div class="card hero"><div><b>${L.length}</b><small>aujourd’hui</small></div><div><b>${W.length}</b><small>cette semaine</small></div></div>
      <p class="hello">${msg}</p>${rows}
      <div class="card"><h2>Évolution semaine après semaine</h2><svg viewBox="0 0 340 142" width="100%" role="img" aria-label="Activités par semaine">${bars}</svg>
      <div class="chips">${S.domains.map(d => `<small>${d.emoji} ${esc(d.name)}</small>`).join(' ')}</div></div>
      <h2 style="margin-top:18px">Historique</h2>${list || '<p class="mu">Ton historique se remplira au fil des jours.</p>'}`;
  }
};

function render() {
  const el = $('#app'), y = scrollY;
  if (!S.user) {
    el.innerHTML = `<div class="login"><h1>To-do list</h1><p>Coche tes tâches, regarde tout ce que tu accomplis.</p>
      <button class="big" data-act="login">Continuer avec Google</button>
      ${CFG.apiKey.startsWith('COLLE') ? '<p class="mu">Configuration Firebase manquante : voir le guide (README).</p>' : ''}</div>`;
    return;
  }
  const n = streak();
  const st = n > 1 ? `🌱 ${n} jours d’affilée` : n === 1 ? '🌱 Nouvelle série' : '🌱 Nouvelle série à lancer';
  const tabs = [['tasks', '✅', 'Tâches'], ['stats', '📊', 'Statistiques']];
  el.innerHTML = `<header><h1>To-do list</h1><span class="st">${st}</span><button class="ib" data-act="settings" aria-label="Réglages">⚙️</button></header>
    <main>${V[S.view]()}</main>
    ${S.view === 'tasks' && S.domains.length ? '<button class="fab" data-act="taskform" data-id="" aria-label="Ajouter une tâche">＋</button>' : ''}
    <nav>${tabs.map(t => `<button class="${S.view === t[0] ? 'on' : ''}" data-act="tab" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
  scrollTo(0, y);
}

/* ============================================================
   5) FEUILLES (fenêtres du bas) ET ACTIONS
   ============================================================ */
function sheet(h) {
  if (!ov) { ov = document.createElement('div'); ov.className = 'ov'; ov.onclick = e => { if (e.target === ov) close(); }; document.body.append(ov); }
  ov.innerHTML = `<div class="sh">${h}</div>`;
}
const close = () => { ov?.remove(); ov = null; };

function settings() {
  sheet(`<h2>Réglages</h2>
    <div class="chips"><button class="cp" data-act="theme">🌓 Clair / sombre</button><button class="cp" data-act="export">⬇️ Exporter (JSON)</button><button class="cp" data-act="logout">Se déconnecter</button></div>
    <small>Compte : ${esc(S.user.email)}<br>Identifiant (UID) : ${esc(S.uid)}</small>`);
}

const A = {
  login() { signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast('Connexion impossible : ' + e.code)); },
  logout() { close(); signOut(auth); },
  tab({ v }) { S.view = v; render(); scrollTo(0, 0); },
  settings, close,
  theme() { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); },
  tick({ id }) { toggle(id); },

  // --- Tâches ---
  taskform({ id }) {
    const t = id ? S.tasks.find(x => x.id === id) : { domainId: S.last, repeat: 'none', text: '' };
    const sel = S.domains.some(d => d.id === t.domainId) ? t.domainId : S.domains[0].id;
    sheet(`<h2>${id ? 'Modifier la tâche' : 'Nouvelle tâche'}</h2>
      <input id="tt" placeholder="Ex. Courir 30 minutes" maxlength="120" value="${esc(t.text)}">
      <select id="td" aria-label="Catégorie">${S.domains.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${x.emoji} ${esc(x.name)}</option>`).join('')}</select>
      <select id="tp" aria-label="Répétition">${[['none', 'Ponctuelle'], ['daily', 'Tous les jours'], ['weekly', 'Toutes les semaines']].map(([v, l]) => `<option value="${v}" ${v === repeatOf(t) ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${id ? '' : '<label class="chk"><input type="checkbox" id="tf"> Déjà fait</label>'}
      <button class="big" data-act="saveTask" data-id="${id || ''}">Enregistrer</button>
      ${id ? `<button class="ghost" data-act="delTask" data-id="${id}">Supprimer la tâche</button>` : ''}`);
    setTimeout(() => $('#tt')?.focus(), 50);
  },
  saveTask({ id }) {
    const o = { text: $('#tt').value.trim(), domainId: $('#td').value, repeat: $('#tp').value, perWeek: 0 };
    if (!o.text) return;
    S.last = o.domainId;
    if (id) updateDoc(taskRef(id), o).catch(err);
    else {
      const r = taskRef(doc(col('tasks')).id);
      setDoc(r, { ...o, done: false, createdAt: Date.now() }).catch(err);
      if ($('#tf').checked) {            // « Déjà fait » : on la crée directement cochée
        S.tasks = [...S.tasks, { id: r.id, ...o, done: false, createdAt: Date.now() }];
        toggle(r.id);
      }
    }
    close();
  },
  delTask({ id }) { if (confirm('Supprimer cette tâche ? (l’historique est conservé)')) { deleteDoc(taskRef(id)).catch(err); close(); } },

  // --- Catégories ---
  domform({ id }) {
    const d = S.domains.find(x => x.id === id) || { name: '', emoji: '⭐', color: COLORS[S.domains.length % COLORS.length], goal: 0 };
    sheet(`<h2>${id ? 'Modifier la catégorie' : 'Nouvelle catégorie'}</h2>
      <div class="row" style="margin-bottom:12px"><input id="de" style="width:70px;text-align:center" value="${esc(d.emoji)}" maxlength="4" aria-label="Emoji"><input id="dn" placeholder="Nom" maxlength="40" value="${esc(d.name)}"></div>
      <input id="dc" type="hidden" value="${d.color}">
      <div class="chips" id="sws">${[...new Set([d.color, ...COLORS])].map(c => `<button class="sw ${c === d.color ? 'on' : ''}" style="--c:${c}" data-act="pickc" data-v="${c}" aria-label="Couleur"></button>`).join('')}</div>
      <label>Objectif par semaine (nombre de tâches faites, 0 = aucun)</label><input id="dg" type="number" inputmode="numeric" min="0" value="${d.goal || 0}">
      <button class="big" data-act="saveDom" data-id="${id || ''}">Enregistrer</button>
      ${id ? `<button class="ghost" data-act="delDom" data-id="${id}">Supprimer la catégorie</button>` : ''}`);
    if (!id) setTimeout(() => $('#dn')?.focus(), 50);
  },
  pickc({ v }) { $('#dc').value = v; document.querySelectorAll('#sws .sw').forEach(b => b.classList.toggle('on', b.dataset.v === v)); },
  saveDom({ id }) {
    const o = { id: id || 'd' + Date.now().toString(36), name: $('#dn').value.trim(), emoji: $('#de').value.trim() || '⭐', color: $('#dc').value, goal: +$('#dg').value || 0 };
    if (!o.name) return;
    saveDomains(id ? S.domains.map(x => x.id === id ? o : x) : [...S.domains, o]); close();
  },
  delDom({ id }) {
    if (!confirm('Supprimer cette catégorie et ses tâches ? Les activités déjà enregistrées restent dans les statistiques.')) return;
    S.tasks.filter(t => t.domainId === id).forEach(t => deleteDoc(taskRef(t.id)).catch(err));
    saveDomains(S.domains.filter(x => x.id !== id)); close();
  },

  // Sauvegarde : tout l'historique (pas seulement les 120 derniers jours)
  async export() {
    const [l, t] = await Promise.all([getDocs(col('logs')), getDocs(col('tasks'))]);
    const map = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), domains: S.domains, tasks: map(t), logs: map(l) }, null, 1)], { type: 'application/json' }));
    a.download = `todo-list-${dk(Date.now())}.json`; a.click();
  }
};
// Un seul écouteur de clics pour toute l'appli (attributs data-act)
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) A[b.dataset.act]?.(b.dataset); });
// Touche Entrée = Enregistrer dans les formulaires
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#tt,#dn')) ov?.querySelector('.big')?.click(); });

/* ============================================================
   6) CONNEXION ET SYNCHRONISATION TEMPS RÉEL
   ============================================================ */
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = []; close();
  S.user = u; S.uid = u?.uid; S.domains = []; S.logs = []; S.tasks = [];
  if (u) {
    const since = Date.now() - 120 * 864e5; // on synchronise les 120 derniers jours
    unsubs = [
      onSnapshot(cfgRef(), s => { S.domains = s.exists() ? (s.data().domains || []) : []; render(); }, err),
      onSnapshot(query(col('logs'), where('ts', '>=', since)), s => { S.logs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.ts - a.ts); render(); }, err),
      onSnapshot(col('tasks'), s => { S.tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err)
    ];
  }
  render();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
